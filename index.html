<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讲话助手</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--text:#2C2C2C;--muted:#666;--line:#D5C5A8;--accent:#8B1A1A;--accent2:#F7EDE3;--gold:#C9A96E;--danger:#c93636;--shadow:0 2px 16px rgba(0,0,0,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1120px;margin:auto;padding:28px 24px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:12px;background:#8B1A1A;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
h1{font-size:22px;margin:0 0 3px;letter-spacing:.5px}.tagline{font-size:13px;color:var(--muted)}
.top-actions{display:flex;gap:8px}.ghost{border:1.5px solid var(--line);background:#fff;color:#8B1A1A;padding:9px 13px;border-radius:9px}
.hero{background:linear-gradient(135deg,#fff 0%,#FAF7F2 100%);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.hero h2{font-size:25px;margin:0 0 7px}.hero p{margin:0 0 25px;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:190px 1fr;gap:16px;margin-bottom:18px;align-items:start}
label{font-weight:700;font-size:14px;padding-top:12px}.hint{display:block;font-size:12px;font-weight:400;color:#9aa2ad;margin-top:5px;line-height:1.5}
input,textarea,select{width:100%;border:1.5px solid #D5C5A8;background:#fff;border-radius:10px;padding:12px 13px;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:#8B1A1A;box-shadow:0 0 0 3px rgba(139,26,26,.12)}
textarea{resize:vertical;min-height:170px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;color:#69727e;font-size:13px}.chip.active{border-color:#8B1A1A;background:var(--accent2);color:var(--accent);font-weight:600}
.drop{border:1.5px solid #D5C5A8;border-radius:10px;padding:15px;color:#8a939e;font-size:13px;background:#fffdf8}
.drop input{display:none}.drop b{color:#3e4752}.file-name{margin-top:7px;color:var(--accent)}
.primary{width:100%;border:0;border-radius:11px;padding:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;margin-top:5px}
.primary:hover{filter:brightness(.96)}
.advanced{margin-top:17px;border-top:1px solid var(--line);padding-top:15px}.adv-title{display:flex;justify-content:space-between;align-items:center;color:#68717e;font-size:13px;cursor:pointer}.adv-body{display:none;margin-top:15px}.advanced.open .adv-body{display:block}.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field-title{font-size:12px;color:#737d89;margin-bottom:7px}
#work{display:none;margin-top:22px}
.learnbox{margin-top:18px;border:1.5px solid var(--line);border-radius:12px;background:#fffdf8;padding:16px}
.learnbox h4{margin:0 0 6px;font-size:14px}.learnbox p{margin:0 0 10px;color:#8a939e;font-size:12px}.learnbox textarea{min-height:110px}.learn-actions{display:flex;gap:8px;margin-top:9px}.learn-tag{display:inline-block;background:#F7EDE3;color:#8B1A1A;border-radius:12px;padding:3px 8px;font-size:11px;margin:3px}.stagebar{display:flex;gap:5px;margin-bottom:14px}.stage{flex:1;text-align:center;padding:8px 4px;border-radius:7px;background:#EDE4D4;color:#87909c;font-size:11px}.stage.on{background:#F7EDE3;color:#8B1A1A}.stage.done{background:#E9F0E8;color:#338452}
.result{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.result-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.result-head b{font-size:16px}.badge{font-size:12px;padding:5px 9px;border-radius:20px;background:#F7EDE3;color:#8B1A1A}.result-body{padding:24px}.adviser{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.panel{border:1px solid var(--line);border-radius:12px;padding:18px}.panel h3{font-size:14px;margin:0 0 11px}.bigjudgment{font-size:21px;line-height:1.55;font-weight:750}.list{margin:0;padding-left:20px;line-height:1.9}.cta-row{display:flex;gap:10px;margin-top:18px}.secondary{border:1.5px solid #D5C5A8;background:#fff;border-radius:9px;padding:10px 15px;color:#596370}.speech{font-size:16px;line-height:2.05;white-space:pre-wrap}.review{margin-top:18px;background:#fffdf8;border:1.5px solid var(--line);border-radius:12px;padding:16px}.review summary{cursor:pointer;font-weight:650}.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px}.score{background:#fff;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:12px}.score strong{display:block;font-size:18px;margin-top:4px}.error{color:var(--danger);background:#fff2f2;border:1px solid #ffd6d6;border-radius:10px;padding:12px;margin-top:12px;font-size:13px}
footer{text-align:center;color:#a0a7b0;font-size:11px;margin-top:25px}
@media(max-width:720px){.app{padding:18px 13px}.hero{padding:20px}.row{grid-template-columns:1fr;gap:7px}.adv-grid,.adviser{grid-template-columns:1fr}.scores{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.top-actions{display:flex;gap:6px}.top-actions .ghost{padding:7px 10px;font-size:13px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">黄</div><div><h1>讲话助手</h1><div class="tagline">您说事，我来谋。 · v50.3</div></div></div>
  <div class="top-actions"><button class="ghost" onclick="showHistory()">历史</button><button class="ghost" onclick="showSettings()">设置</button></div>
</header>

<section class="hero">
  <h2>这次讲话，您最想讲清楚什么？</h2>
  <p>不用先想结构、金句、标题。把您知道的情况、想法、问题、担心的地方，零碎地写下来，帮您梳理。</p>

  <div class="row">
    <label>什么场合？<span class="hint">不知道也没关系，可以自动判断</span></label>
    <div class="chips" id="sceneChips">
      <button class="chip active" data-v="工作会议">工作会议</button>
      <button class="chip" data-v="调研座谈">调研座谈</button>
      <button class="chip" data-v="汇报发言">汇报发言</button>
      <button class="chip" data-v="部署讲话">部署讲话</button>
      <button class="chip" data-v="其他">其他</button>
    </div>
  </div>

  <div class="row">
    <label>讲话人<span class="hint">可不填</span></label>
    <input id="speaker" placeholder="如：市政府分管领导、局长、县委书记……">
  </div>

  <div class="row">
    <label>把情况告诉我<span class="hint">越真实、越具体越好；不用整理</span></label>
    <textarea id="brief" placeholder="例如：明天参加全市高中教育工作座谈会。我现在最担心的是优质生源流失、出生人口下降，高中学校之间竞争越来越激烈。过去大家主要拼升学率，但现在单纯靠抢生源可能越来越难。我希望这次讲话不要停留在“提高教学质量”这种常规表述上，要把形势变化、真正矛盾和下一步怎么破讲透。"></textarea>
  </div>

  <div class="row">
    <label>有什么材料？<span class="hint">没有也可以直接开始</span></label>
    <div>
      <label class="drop" for="file"><b>点击上传</b> 或把材料拖进这里<input id="file" type="file" accept=".txt,.docx,.pdf"><div class="file-name" id="fileName"></div></label>
      <textarea id="reference" style="margin-top:9px;min-height:85px" placeholder="也可以直接粘贴材料、数据、政策依据……"></textarea>
    </div>
  </div>

  <button class="primary" onclick="start()">现在开始思考</button>

  <div class="advanced" id="advanced">
    <div class="adv-title" onclick="toggleAdvanced()"><span>高级设置 · 默认自动判断</span><span id="advArrow">＋</span></div>
    <div class="adv-body">
      <div class="adv-grid">
        <div><div class="field-title">听众</div><input id="audience" placeholder="如：市直部门、学校负责人、基层干部"></div>
        <div><div class="field-title">模式</div><select id="mode"><option value="writer">成稿：谋完直接写</option><option value="adviser">参谋：先给方向和立意</option></select></div>
        <div><div class="field-title">结构偏好（仅作参考）</div><select id="structure"><option>自动判断</option><option>总分式</option><option>问题式</option><option>认知式</option><option>辩证式</option><option>时间式</option></select></div>
        <div><div class="field-title">其他要求</div><input id="extra" placeholder="如：控制在2000字左右、少用套话、更加口语化"></div>
      </div>
    </div>
  </div>
</section>

<section id="work">
  <div style="font-size:12px;color:#8a939e;margin:0 0 8px 2px">正在替您完成：看局面 → 找矛盾 → 定主旨 → 谋结构 → 写讲话 → 挑问题</div>
  <div class="stagebar" id="stagebar">
    <div class="stage">看清局面</div><div class="stage">找准矛盾</div><div class="stage">形成判断</div><div class="stage">设计逻辑</div><div class="stage">写成讲话</div><div class="stage">反向审稿</div>
  </div>
  <div class="result" id="result"></div>
</section>
<footer>讲话助手　不只替您写，更替您想</footer>
</div>

<script>
const state={scene:"工作会议",fileText:"",context:null,history:JSON.parse(localStorage.getItem("zhiheng_history")||"[]")};
document.querySelectorAll(".chip").forEach(x=>x.onclick=()=>{document.querySelectorAll(".chip").forEach(y=>y.classList.remove("active"));x.classList.add("active");state.scene=x.dataset.v});
document.getElementById("file").onchange=e=>{const f=e.target.files[0];if(f){document.getElementById("fileName").textContent="已选择："+f.name;const r=new FileReader();r.onload=()=>state.fileText=r.result;r.readAsText(f)}};

function toggleAdvanced(){const a=document.getElementById("advanced");a.classList.toggle("open");document.getElementById("advArrow").textContent=a.classList.contains("open")?"－":"＋"}
function setStage(n){document.querySelectorAll(".stage").forEach((x,i)=>x.className="stage "+(i<n?"done":i===n?"on":""))}
function getKey(){return localStorage.getItem("zhiheng_api_key")||""}
function getProvider(){const p=localStorage.getItem("zhiheng_provider");return p==="kimi"?"kimi":"deepseek"}
function getModel(){const m=localStorage.getItem("zhiheng_model");return (m==="deepseek-v4-pro"||m==="kimi-k2-6")?m:"deepseek-v4-pro"}

const ZHENGHENG_MEMORY = `
【知衡长期写作记忆】
写作定位：大秘般的逻辑思路、诗人般的文化情怀、专家级的严谨态度、学者型的钻研精神。
总标准：观点新颖、逻辑清晰、语句鲜活、结构严谨、依据准确、排版精致、大气蓬勃、感人至深、令人振奋、追求极致。
核心要求：
1. 意图穿透：理解用户真正想解决什么，写“心里想要的那一篇”，不能只改写表面要求。
2. 先看局、再找矛盾、再形成判断、再设计结构、最后落笔。思想先于语言，判断先于结构，事实先于修辞。
3. 提炼不照搬：素材只作为证据和原料，用更高站位、更强逻辑、更精文字重新提炼。
4. 问题有分寸：肯定成绩是主流，问题不尖刻、不绝对、不以偏概全；涉及领导主抓领域，优先归因于客观形势、机制、环境、阶段性约束，给足台阶。
5. 每个重要判断尽可能有具体事实、数据、案例支撑；存疑数据必须核实，不能编造。
6. 建议具体化：尽量回答谁来做、做什么、怎么做、做到什么程度，避免“进一步加强、持续提升”式空话。
7. 标题精准优先于工整：罩得住正文、不空喊口号、不搞生造概念；并列标题尽量统一结构、字数和语法节奏，同时避免重复用字和重复风格。
8. 公文比喻要庄重规范，如“落地生根、后半篇文章、中梗阻、扶上马送一程”，不使用轻佻、口语化、文艺腔比喻。
9. 金句只在需要时使用，最好一处即止；必须扣题、从正文判断自然生长，不硬造。结尾宜短促、有记忆点、有行动或愿景落点。
10. 思想的化境：不靠“值得深思、引人思考、我们应当”等指令性句式，而通过选择事实、安排细节、陌生化视角和语言克制让思想自己出现。
11. 党政公文以规范庄重为底色，新颖体现在判断、标题、提炼和表达，不把调研报告写成散文，不把讲话写成论文。
12. 修改已审定稿：尊重原文架构，原则上不推倒重来；重点润色标题、打磨文字、提炼升华。数据留白不能擅自删除，必须补充或明确待核实。
13. 语言细节：不用破折号；避免空泛四字词堆砌；成绩与问题转折清楚，避免用分号硬拼性质不同的两面；中文引号优先。
14. 最终标准不是“像AI写得很好”，而是“像一个真正懂局面、懂政策、懂讲话的人想明白后写出来的”。

【知衡判断优先级】
真实性 > 政策边界 > 核心判断 > 逻辑闭合 > 针对性 > 现场感 > 语言质量 > 修辞装饰。
如果这些要求发生冲突，按上述优先级处理。
`;

function sys(){
return ZHENGHENG_MEMORY + `
你是“知衡”，一名长期服务党政机关主要领导和分管领导的高级讲话参谋、政策研究员和文字总顾问。
你的任务不是把用户的话换一种说法，而是先理解局面，再识别真正矛盾，形成判断，设计逻辑，最后写成能让领导自然讲出来的讲话。
最高原则：思想先于语言，判断先于结构，事实先于修辞，针对性先于漂亮，内容决定形式。
讲话不是论文，不追求面面俱到。不要为了“金句”而金句，不要机械排比，不要堆砌四字词，不要反复使用“要……要……要……”，不要制造空泛的正确话。
没有依据的事实不能编造；没有材料的本地情况不能冒充掌握；不能确定的数据明确标注待核实。
用户指定的结构、价值、标题都只是偏好。如果与你形成的核心判断冲突，应优先保证思想和逻辑，并说明调整理由。
最终目标：让人觉得这不是AI把话写漂亮了，而是有人真正想明白了这件事。`;
}

async function callAI(system,user){
 const key=getKey(); if(!key) throw new Error("请先在“设置”中填写 API Key。");
 const provider=getProvider(), model=getModel();
 const url=provider==="kimi"?"https://api.moonshot.cn/v1/chat/completions":"https://api.deepseek.com/chat/completions";
 const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,messages:[{role:"system",content:system},{role:"user",content:user}],temperature:.65,max_tokens:8192})});
 if(!r.ok){
   let msg="";
   try{const e=await r.json();msg=(e?.error?.message||e?.message||"").slice(0,200)}catch(_){}
   let hint="";
   if(/context|token|length|maximum/i.test(msg)) hint="。疑似输入内容过长，请精简参考材料或去掉上传文件后再试";
   else if(/model/i.test(msg)) hint="。疑似模型名称不正确，请到“设置”重新选择模型（1. deepseek-v4-pro / 2. kimi-k2-6）";
   else if(/key|auth|invalid/i.test(msg)) hint="。疑似 API Key 无效或已过期，请到“设置”重新填写";
   throw new Error("接口调用失败("+r.status+")"+(msg?"："+msg:"")+hint);
 }
 const j=await r.json(); return j.choices?.[0]?.message?.content||"";
}

const BRAIN={
  know:`你是“知局官”。不要写讲话。先把局面看清楚。
必须识别：场合与政治语境、讲话人的身份、听众及其心理、讲话真正目的、为什么现在要讲、背景变化、表层现象、深层矛盾、利益关系/机制障碍/能力短板/认知偏差/阶段变化、政策边界、事实与数据、信息缺口。
尤其警惕把“工作还不够”“认识还不深”“力度还不大”当成问题。
输出严格JSON：background,timing,coreSituation,contradictions[],audiencePsychology,purpose,verifiedFacts[],factsToVerify[],informationGaps[]。`,
  adviser:`你是“首席参谋”。核心问题只有一个：面对这个局面，讲话人现在最应该讲什么？
从现象进入机制，从问题进入矛盾，从矛盾进入趋势，从趋势找到突破口。
优先寻找结构性矛盾、机制性矛盾、阶段性矛盾，而不是罗列工作任务。
输出严格JSON：overallJudgment,coreContradictions[],breakthroughDirections[],recommendedDirection,keyJudgment,avoidDirections[]。`,
  thesis:`你是“立意官”。把参谋判断变成能够统领全篇的思想。
先内部提出至少5个主旨方案，再比较其深度、针对性、新意、政治质量、解释力、可展开性、领导讲话适配度、本地适配度，最终只输出最优方案。
输出严格JSON：coreThesis,coreQuestion,supportingJudgments[],logicRelation,evidenceNeeds[],titleDirections[]。`,
  outline:`你是“谋篇官”。结构不是模板，而是思想的骨架。
判断用户偏好的结构是否真的适合；不适合就换。全篇只保留一条主逻辑，每一部分都必须承担不可替代的论证任务。
输出严格JSON：structure,structureReason,overallLogic,openingTask,sections[{title,coreJudgment,logicalTask,evidence,caseSupport,transition}],endingTask。`,
  review:`你是“知衡审稿官”，采取对抗式审稿，不负责夸奖。
检查：思想深度、逻辑闭合、针对性、事实准确、政策边界、领导讲话口语感、辨识度、AI味。
重点抓：正确但没有价值、漂亮但没有思想、全面但没有重点、结构完整但逻辑松散、硬塞金句、机械排比、本地名词堆砌、政策词堆砌。
输出严格JSON：scores{thought,logic,targeting,fact,policy,oral,distinctiveness,aiTaste},criticalProblems[],mustFix[],suggestions[],retain[],route。route只能是PASS、REWRITE、RETURN_TO_KNOW、RETURN_TO_ADVISER、RETURN_TO_THESIS、RETURN_TO_OUTLINE。`
};

function cleanJSON(t){
  const x=String(t||"").trim().replace(/^```json\s*/i,"").replace(/^```\s*/,"").replace(/```$/,"").trim();
  try{return JSON.parse(x)}catch(e){
    const a=x.indexOf("{"),b=x.lastIndexOf("}");
    if(a>=0&&b>a) try{return JSON.parse(x.slice(a,b+1))}catch(_){}
    return {raw:x};
  }
}
function brainInput(payload){return JSON.stringify(payload,null,2)}
function trim(s,n){return String(s||"").length>n?String(s||"").slice(0,n)+"…[已截断]":String(s||"")}
function compactForWrite(c){
  const k=c.situation||{},s=c.strategy||{},t=c.thesis||{},o=c.outline||{},b=c.brief||{};
  return JSON.stringify({
    场合:b.scene||"",
    要点:trim(b.brief,1500),
    讲话人:b.speaker||"",
    听众:b.audience||"",
    材料:trim(b.reference,3000),
    其他要求:b.extra||"",
    局面:{coreSituation:k.coreSituation,contradictions:(k.contradictions||[]).slice(0,6),purpose:k.purpose},
    参谋判断:{overallJudgment:s.overallJudgment,coreContradictions:(s.coreContradictions||[]).slice(0,5),breakthroughDirections:(s.breakthroughDirections||[]).slice(0,5),recommendedDirection:s.recommendedDirection,avoidDirections:(s.avoidDirections||[]).slice(0,4)},
    主旨:{coreThesis:t.coreThesis,coreQuestion:t.coreQuestion,supportingJudgments:(t.supportingJudgments||[]).slice(0,6),titleDirections:(t.titleDirections||[]).slice(0,5)},
    结构:{structure:o.structure,overallLogic:o.overallLogic,sections:(o.sections||[]).slice(0,8),openingTask:o.openingTask,endingTask:o.endingTask}
  },null,1)
}

function getLearned(){
  try{return JSON.parse(localStorage.getItem("zhiheng_learned")||"[]")}catch(e){return[]}
}
function saveLearned(items){
  const old=getLearned();
  const all=[...items,...old].slice(0,80);
  localStorage.setItem("zhiheng_learned",JSON.stringify(all));
}
async function learnFromRevision(){
  const revised=document.getElementById("revisedDraft")?.value.trim();
  if(!revised){alert("请先把您修改后的版本粘贴进来。");return}
  const original=window.last?.draft||"";
  try{
    const learning=cleanJSON(await callAI(sys()+`
【用户偏好学习官】
比较“原稿”和“用户修改稿”，不要评价用户，也不要简单总结差异。
重点反推用户为什么这样改，并提炼成以后可复用的写作偏好。
只提炼稳定规则，不保存具体人名、项目名、数字等一次性信息。
输出严格JSON数组，每项包含：
{"rule":"一条可执行写作规则","reason":"从修改中推断出的原因","priority":"high/medium/low"}。
最多8条。`,JSON.stringify({original,revised})));
    const arr=Array.isArray(learning)?learning:(learning.rules||[]);
    saveLearned(arr);
    document.getElementById("learnMsg").textContent=`已学习 ${arr.length} 条偏好。以后生成讲话时会自动参考。`;
  }catch(e){document.getElementById("learnMsg").textContent="学习失败："+e.message}
}
function learnedPrompt(){
  const x=getLearned();
  if(!x.length)return "";
  let out="";
  for(let i=0;i<x.length&&out.length<900;i++){
    const r=(x[i].rule||"").slice(0,120);
    const rs=(x[i].reason||"用户修改行为归纳").slice(0,80);
    out+=(i+1)+". "+r+"（"+rs+"）\n";
  }
  return "\n【用户长期偏好学习结果】\n"+out;
}

async function start(){
 const brief=document.getElementById("brief").value.trim();
 if(!brief){alert("先把您知道的情况告诉我，零碎一点也没关系。");return}
 document.getElementById("work").style.display="block";setStage(0);
 const payload={
   scene:state.scene, brief,
   speaker:document.getElementById("speaker").value,
   audience:document.getElementById("audience").value,
   reference:trim(document.getElementById("reference").value+"\n"+state.fileText,6000),
   structurePreference:document.getElementById("structure").value,
   extra:document.getElementById("extra").value
 };
 const context={brief:payload,situation:null,strategy:null,thesis:null,outline:null,draft:null,review:null,learned:getLearned()};
 try{
   setStage(0);
   context.situation=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.know,brainInput(payload)));

   setStage(1);
   context.strategy=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.adviser,brainInput({brief:payload,situation:context.situation})));

   setStage(2);
   context.thesis=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.thesis,brainInput({brief:payload,situation:context.situation,strategy:context.strategy})));

   if(document.getElementById("mode").value==="adviser"){
     setStage(5); renderBrainDesk(context); saveHistory("参谋",payload,context); return;
   }

   setStage(3);
   context.outline=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.outline,brainInput({brief:payload,situation:context.situation,strategy:context.strategy,thesis:context.thesis})));

   setStage(4);
   context.draft=await callAI(sys()+learnedPrompt()+`
【首席撰稿人】
现在才开始写。必须完全服从前面的“局—矛盾—判断—逻辑”。
不要把分析报告写成讲话，不要逐条复述JSON。
讲话要像一个真正的领导在这个场合讲话：有现场感，有判断，有轻重，有取舍。
允许有长短句变化；不要强制每句等长，不要强制每段排比。
金句只能从真实判断自然长出来。少用空泛的“要……要……要……”，少用“我们要深刻认识……切实增强……”等套话。
如果材料不足，不编事实。
`+compactForWrite(context));

   setStage(5);
   context.review=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.review,compactForWrite(context)+"\n【待审成稿】\n"+trim(context.draft,8000)));

   // 一次定向重写：只修真正的问题，不无限循环。
   if(context.review.route==="REWRITE"){
     context.draft=await callAI(sys()+`
【知衡重写官】
这是一次针对性重写，不是另起炉灶。
保留原稿真正好的判断和表达，只解决审稿官指出的核心问题。
重写后仍必须符合“领导讲话”而不是“论文/调研报告”。
`+compactForWrite(context)+"\n【审稿意见】\n"+JSON.stringify({criticalProblems:context.review.criticalProblems||[],mustFix:context.review.mustFix||[],suggestions:context.review.suggestions||[]})+"\n【原稿】\n"+trim(context.draft,8000));
     context.review=cleanJSON(await callAI(sys()+learnedPrompt()+"\n"+BRAIN.review,compactForWrite(context)+"\n【待审成稿】\n"+trim(context.draft,8000)));
   }

   renderDraft(context);
   saveHistory("成稿",payload,context);
 }catch(e){
   document.getElementById("result").innerHTML='<div class="error">'+esc(e.message)+'</div>'
 }
}

function renderBrainDesk(c){
 const s=c.strategy||{},t=c.thesis||{},k=c.situation||{};
 document.getElementById("result").innerHTML=`
 <div class="result-head"><b>参谋桌</b><span class="badge">已经替您想了一遍</span></div>
 <div class="result-body">
   <div class="panel" style="margin-bottom:18px"><h3>一句话判断</h3><div class="bigjudgment">${esc(s.overallJudgment||s.raw||"")}</div></div>
   <div class="adviser">
    <div class="panel"><h3>真正的矛盾</h3><ul class="list">${(s.coreContradictions||k.contradictions||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>
    <div class="panel"><h3>建议主旨</h3><div class="speech">${esc(t.coreThesis||"")}</div></div>
   </div>
   <div class="panel" style="margin-top:18px"><h3>破题方向</h3><ul class="list">${(s.breakthroughDirections||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>
   <div class="panel" style="margin-top:18px"><h3>标题方向</h3><ul class="list">${(t.titleDirections||[]).map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>
   <div class="cta-row"><button class="primary" style="width:auto" onclick="continueWrite()">按这个思路写成讲话</button><button class="secondary" onclick="copyBrain()">复制参谋成果</button></div>
 </div>`;
 window.last=c;
}
function continueWrite(){document.getElementById("mode").value="writer";start()}
function renderDraft(c){
 const r=c.review||{};
 const sc=r.scores||{};
 document.getElementById("result").innerHTML=`
 <div class="result-head"><b>讲话稿</b><span class="badge">${r.route==="PASS"?"审稿通过":"已完成定向校正"}</span></div>
 <div class="result-body">
   <div class="speech" id="speech">${esc(c.draft)}</div>
   <div class="review"><details><summary>展开“审稿意见”</summary>
    <div class="scores">
      <div class="score">思想深度<strong>${esc(sc.thought??"—")}</strong></div>
      <div class="score">逻辑结构<strong>${esc(sc.logic??"—")}</strong></div>
      <div class="score">针对性<strong>${esc(sc.targeting??"—")}</strong></div>
      <div class="score">AI味控制<strong>${esc(sc.aiTaste??"—")}</strong></div>
    </div>
    <p class="speech" style="font-size:13px;line-height:1.7"><b>关键问题：</b>${esc((r.criticalProblems||[]).join("；"))}<br><b>建议：</b>${esc((r.suggestions||[]).join("；"))}</p>
   </details></div>
   <div class="cta-row"><button class="secondary" onclick="copyText()">复制全文</button><button class="secondary" onclick="downloadTxt()">导出TXT</button></div>
   <div class="learnbox">
     <h4>让助手越来越懂您 <span class="learn-tag">长期学习</span></h4>
     <p>您如果亲自改过这篇，把最终版本粘贴进来。助手会比较前后差异，只学习“为什么这样写”，不会机械记住一次性的姓名、数字和项目。</p>
     <textarea id="revisedDraft" placeholder="把您修改后的最终稿粘贴到这里……"></textarea>
     <div class="learn-actions"><button class="secondary" onclick="learnFromRevision()">让助手学习这次修改</button><span id="learnMsg" style="font-size:12px;color:#5d8a6c;padding:10px"></span></div>
   </div>
 </div>`;
 window.last=c;
}
function copyBrain(){const c=window.last||{};navigator.clipboard?.writeText(JSON.stringify({strategy:c.strategy,thesis:c.thesis},null,2)).then(()=>alert("已复制"))}

function renderAdviser(x){
document.getElementById("result").innerHTML=`<div class="result-head"><b>参谋意见</b><span class="badge">先谋后写</span></div><div class="result-body"><div class="adviser"><div class="panel"><h3>一句话总判断</h3><div class="bigjudgment">${esc(x.adviser)}</div></div><div class="panel"><h3>核心立意</h3><div class="speech">${esc(x.thesis)}</div></div></div><div class="panel" style="margin-top:20px"><h3>知局分析</h3><div class="speech">${esc(x.know)}</div></div><div class="cta-row"><button class="primary" style="width:auto" onclick="continueWrite()">按这个思路写成讲话</button><button class="secondary" onclick="copyText()">复制参谋意见</button></div></div>`;window.last=x}
function continueWrite(){document.getElementById("mode").value="writer";start()}
function renderDraft(x){
document.getElementById("result").innerHTML=`<div class="result-head"><b>讲话稿</b><span class="badge">已审</span></div><div class="result-body"><div class="speech" id="speech">${esc(x.draft)}</div><div class="review"><details><summary>查看“审稿”意见</summary><div class="scores"><div class="score">思想深度<strong>—</strong></div><div class="score">逻辑结构<strong>—</strong></div><div class="score">针对性<strong>—</strong></div><div class="score">AI味控制<strong>—</strong></div></div><p class="speech" style="font-size:13px;line-height:1.7">${esc(x.review)}</p></details></div><div class="cta-row"><button class="secondary" onclick="copyText()">复制全文</button><button class="secondary" onclick="downloadTxt()">导出TXT</button></div></div>`;window.last=x}
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function copyText(){const t=window.last?.draft||window.last?.thesis||"";navigator.clipboard?.writeText(t).then(()=>alert("已复制"))}
function downloadTxt(){const t=window.last?.draft||"";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain;charset=utf-8"}));a.download="讲话稿.txt";a.click()}
function saveHistory(type,payload,data){state.history.unshift({time:new Date().toLocaleString(),type,payload,data});state.history=state.history.slice(0,30);localStorage.setItem("zhiheng_history",JSON.stringify(state.history))}
function showHistory(){alert("历史记录已保存在本机。当前版本提供本地记录能力，后续可继续扩展为卡片式历史库。")}
function showSettings(){
 const p=prompt("输入 API Key（仅保存在本机浏览器）：",getKey()); if(p!==null)localStorage.setItem("zhiheng_api_key",p);
 const cur=getModel();
 const sel=prompt("选择写稿模型（当前："+cur+"）：\n1. deepseek-v4-pro（默认，逻辑强）\n2. kimi-k2-6（写作更像人）", cur==="kimi-k2-6"?"2":"1");
 if(sel==="2"){localStorage.setItem("zhiheng_provider","kimi");localStorage.setItem("zhiheng_model","kimi-k2-6");}
 else if(sel==="1"){localStorage.setItem("zhiheng_provider","deepseek");localStorage.setItem("zhiheng_model","deepseek-v4-pro");}
}
</script>
